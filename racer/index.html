<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MIRA Racer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; bottom: 12px; color: #fff;
      font: 14px/1.45 ui-monospace, monospace; text-shadow: 0 1px 3px #000;
      user-select: none; pointer-events: none;
    }
    #boostbar { width: 140px; height: 9px; background: #ffffff33; border-radius: 4px; margin-top: 4px; }
    #boostfill { height: 100%; width: 60%; background: #18e0ff; border-radius: 4px; }
    #help {
      position: fixed; right: 12px; bottom: 12px; color: #ffffffb0;
      font: 12px/1.5 ui-monospace, monospace; text-align: right; text-shadow: 0 1px 3px #000;
      user-select: none; pointer-events: none;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud"></div>
  <div id="help">
    WASD / arrows drive · Space handbrake · Shift boost · F fire<br />
    B toggle bot · N new track (seed+1) · R restart<br />
    try: ?prompt=night+race+with+monsters+and+a+gun
  </div>
  <script type="module" src="/src/game/main.js"></script>
</body>
</html>
